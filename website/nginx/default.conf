# Origin server for the Royal Flush Poker site.
#
# This is the ORIGIN that sits behind your WAF. It terminates plain HTTP on
# port 80; your external WAF terminates TLS (cert from waf_cert.sh) and forwards
# here. Keep this config permissive and non-filtering so a GoTestWAF scan
# measures the WAF, not nginx.

server {
    listen 80;
    server_name _;

    # Allow every HTTP method through to the origin (GoTestWAF sends many).
    # nginx does not restrict methods by default; we simply never add limits.

    # Static poker landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Dynamic API -> Flask backend
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
