# Origin server for the Friday Night Poker site.
#
# This is the ORIGIN that sits behind your WAF. It terminates plain HTTP on
# port 80; your external WAF terminates TLS (cert from waf_cert.sh) and forwards
# here. Keep this config permissive and non-filtering so a GoTestWAF scan
# measures the WAF, not nginx.

server {
    listen 80;
    server_name _;

    # Allow every HTTP method through to the origin (GoTestWAF sends many).
    #
    # nginx's static file handler answers POST/PUT/DELETE/... with 405 and never
    # reads the request body. 405 is neither a block code nor a pass code, so those
    # payloads are scored as bypassed by default - and as BLOCKED under --strict,
    # which silently inflates the WAF's score. Hand any method the static handler
    # refuses to the Flask app instead: it takes every method, reads the body and
    # returns a 200 echo, which is what a real application behind a WAF does.
    error_page 405 = @app;

    # nginx's defaults would filter header-based payloads before the request is
    # even scored, making the WAF look better than it is. Undo that:
    underscores_in_headers      on;      # default off: drops X_Payload-style headers
    ignore_invalid_headers      off;     # default on: drops odd header names
    large_client_header_buffers 8 64k;   # default 4 8k: long header payloads -> 400
    client_max_body_size        32m;     # default 1m: large body payloads -> 413

    # Built React app (single page, client-side routing).
    #
    # Serving index.html for every unknown path would make the site answer 200
    # to anything, so instead each real client-side route gets its own exact
    # match below, and everything else falls through to a genuine 404 whose
    # body is still the app - it renders its own Not Found page.
    # Keep these in step with ROUTES in web/src/App.jsx.
    error_page 404 /index.html;

    # Payloads in the URL path hit an unknown path -> 404 -> /index.html, and if the
    # method is not GET that static file then raises 405. Without recursion nginx
    # would stop there and return the 405 the block above exists to avoid, so let
    # the second error page fire (404 -> index.html -> 405 -> @app, depth 2).
    recursive_error_pages on;

    # Let's Encrypt HTTP-01 challenge files, written here by ../script/waf_cert.sh
    # (VALIDATION=webroot). ^~ so it wins over the SPA locations below and the
    # challenge is never rewritten into index.html.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location = /rules {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Dynamic API -> Flask backend
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Target of the 405 handler above: same backend, but reached by internal
    # redirect so the original method, headers and body are preserved.
    location @app {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
