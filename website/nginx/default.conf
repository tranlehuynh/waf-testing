# Origin server for the Friday Night Poker site.
#
# This is the ORIGIN that sits behind your WAF. It terminates plain HTTP on
# port 80; your external WAF terminates TLS (cert from waf_cert.sh) and forwards
# here. Keep this config permissive and non-filtering so a GoTestWAF scan
# measures the WAF, not nginx.
#
# The overriding rule: every request must come back with a status code GoTestWAF can
# score - 200 from here, or a block code from the WAF. A 404, 405, 413 or 414 emitted
# by this file is neither, and GoTestWAF's --nonBlockedAsPassed then quietly files it
# as a WAF bypass (or, for a benign payload, as a false positive). Two earlier scans
# lost ~40% of their test cases to a 405 from the static handler below.

# Non-GET/HEAD must never reach nginx's static file handler: it answers 405 without
# ever reading the request body. Point those methods at a name that cannot exist on
# disk, so try_files falls through to @app (Flask), which reads the body and returns
# 200. A `if ($request_method !~ ^(GET|HEAD)$)` block would not do: try_files is still
# inherited there, so POST / would match $uri/ -> index.html and be served statically
# with the body silently discarded - a 200 that never reached an application.
map $request_method $static_probe {
    default  /__non_get_to_app;
    GET      $uri;
    HEAD     $uri;
}

# Requests nginx answers itself never reach Flask's evidence log, and those are exactly
# the ones that come back unscoreable. $http_x_gotestwaf_test is the debug header
# GoTestWAF adds with --addDebugHeader; it joins a log line to a row in the CSV report.
log_format waf '$time_iso8601 $remote_addr "$request_method $uri" $status '
               'req_len=$request_length ua="$http_user_agent" '
               'gtw="$http_x_gotestwaf_test" upstream=$upstream_addr';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log waf;

    # Safety net for anything that bypasses `location /` below - a POST to the exact
    # match on /rules still goes through the static handler.
    error_page 405 = @app;
    recursive_error_pages on;

    # nginx's defaults would filter header-based payloads before the request is
    # even scored, making the WAF look better than it is. Undo that:
    underscores_in_headers      on;      # default off: drops X_Payload-style headers
    ignore_invalid_headers      off;     # default on: drops odd header names
    client_max_body_size        32m;     # default 1m: large body payloads -> 413
    # default 4 8k: GoTestWAF puts payloads up to 128 KB in the URL path, and a request
    # line longer than the buffer becomes a 414. Worst case ~1 MB per connection,
    # allocated lazily - fine for a deliberately permissive test origin, not for prod.
    large_client_header_buffers 8 128k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Let's Encrypt HTTP-01 challenge files, written here by ../script/waf_cert.sh
    # (VALIDATION=webroot). ^~ so it wins over the SPA locations below and the
    # challenge is never rewritten or handed to Flask. Certificate renewal depends
    # on this location returning the file's own contents.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Built React app (single page, client-side routing). Each real client-side route
    # gets its own exact match so a refresh on it serves the app shell.
    # Keep these in step with ROUTES in web/src/App.jsx.
    location = /rules {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Unknown paths fall through to Flask instead of 404. A payload in the URL path
        # then reaches an application sink and is answered 200, which is both scoreable
        # and evidence of reach. Trade-off: a mistyped URL returns JSON rather than the
        # SPA's styled Not Found page, which is now reached by in-app navigation only.
        try_files $static_probe $static_probe/ @app;
    }

    # Dynamic API -> Flask backend
    location /api/ {
        proxy_pass http://api:5000;
    }

    # Target of the fallbacks above: same backend, reached by internal redirect so the
    # original method, headers and body are preserved.
    location @app {
        proxy_pass http://api:5000;
    }
}
