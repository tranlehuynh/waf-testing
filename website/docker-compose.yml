# A scan is thousands of requests with bodies up to 128 KB, and the api service writes
# a JSON evidence line per request. Docker's json-file driver is unbounded by default,
# so both services get an explicit cap - otherwise a few scans fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Two networks are the load-bearing safety boundary. `edge` carries public traffic and
# has normal internet egress. `detonation` has internal:true, so Docker sets up NO NAT to
# the outside: containers whose ONLY network is `detonation` cannot reach the internet,
# the LAN, or the host. `sink` and `mongo` live only there, so even genuine RCE inside the
# sink cannot phone home or pivot. `api` bridges both, but it runs only our trusted code
# (it does not forward packets), so it is not a usable router out of `detonation`.
networks:
  edge:
  detonation:
    internal: true

services:
  api:
    build: ./api
    expose:
      - "5000"          # internal only; nginx reaches it over the compose network
    environment:
      SINK_URL: "http://sink:5001/run"
      # Set to your own collaborator domain suffix (e.g. "abc123.oast.me") to enable the
      # real Log4Shell OOB callback. Empty = detect + log JNDI, but make no outbound call.
      JNDI_CALLBACK_ALLOW: ""
    networks:
      - edge
      - detonation
    depends_on:
      - sink
    restart: unless-stopped
    logging: *logging

  # Build-only container: it publishes the compiled React assets into the `site` volume
  # and exits. It serves nothing and needs no network (`none`, so no stray default
  # network is created). The old dist is cleared first, or renamed-away asset hashes from
  # a previous build would accumulate in the volume forever.
  web:
    build: ./web
    command: sh -c "rm -rf /site/* && cp -a /app/dist/. /site/"
    volumes:
      - site:/site
    network_mode: none
    restart: "no"       # a one-shot copy; restarting it would just redo the same copy

  # The public face of the origin: the official nginx image, unmodified. It serves the
  # assets `web` left in the volume and proxies /api/ to the api service. Both the config
  # and the challenge dir are bind-mounted, so an nginx-only change needs just
  # `docker compose restart nginx` - no image rebuild.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"         # the origin port your WAF forwards to
    volumes:
      - site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme-challenge:/var/www/acme:ro   # Let's Encrypt challenge files (../script/waf_cert.sh)
    depends_on:
      # Waiting for the copy to finish is what keeps nginx from serving an empty docroot
      # on a first start; `api` only has to be started, since nginx proxies to it lazily.
      web:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - edge
    restart: unless-stopped
    logging: *logging

  # The detonation chamber: deliberately vulnerable, safe only by containment.
  # No published port, no egress, non-root, all caps dropped, read-only rootfs (payloads
  # get a tmpfs /tmp to work in), process and memory capped. Only fake data lives here.
  sink:
    build: ./sink
    environment:
      MONGO_URL: "mongodb://mongo:27017"
    networks:
      - detonation
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    depends_on:
      - mongo
    restart: unless-stopped
    logging: *logging

  # Real document store for genuine NoSQL injection ($where server-side JS). Fake data,
  # ephemeral (tmpfs), no egress. Drop this service and the sink falls back to an
  # in-process operator evaluator (auth-bypass demo without $where).
  mongo:
    image: mongo:6
    command: ["--bind_ip_all"]
    networks:
      - detonation
    tmpfs:
      - /data/db
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

# The compiled React assets: written by `web` on every start, served read-only by nginx.
# A named volume rather than a bind mount, so the build output never lands on the host.
volumes:
  site:
