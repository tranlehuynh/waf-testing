services:
  api:
    build: ./api
    expose:
      - "5000"          # internal only; nginx reaches it over the compose network
    restart: unless-stopped

  web:
    build: ./web        # builds the React app, then serves it with nginx
    ports:
      - "80:80"         # the origin port your WAF forwards to
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme-challenge:/var/www/acme:ro   # Let's Encrypt challenge files (../script/waf_cert.sh)
    depends_on:
      - api
    restart: unless-stopped
