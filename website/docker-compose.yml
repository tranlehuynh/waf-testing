services:
  api:
    build: ./api
    expose:
      - "5000"          # internal only; nginx reaches it over the compose network
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"         # the origin port your WAF forwards to
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
